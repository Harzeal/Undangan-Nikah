<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sampul Undangan — Efrizal &amp; Vina Dewi Pohan</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&amp;family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&amp;family=Plus+Jakarta+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#FAF6F0',
            beige: '#EFE6D8',
            sand: '#E4D5C1',
            pastelBlue: '#8DA9C4',
            softBlue: '#D8E5F0',
            deepBlue: '#5B7894',
            sepia: '#5C4938',
            earth: '#8C6D53',
            clay: '#B08968'
          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sketch: ['"Caveat"', 'cursive'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>

  <style>
    body {
      background-color: #FAF6F0;
      color: #5C4938;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      background-image:
        radial-gradient(circle at 15% 20%, rgba(216, 229, 240, 0.5) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(239, 230, 216, 0.7) 0%, transparent 50%),
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    body.page-leave {
      opacity: 0;
      transform: scale(0.98);
    }

    .sketch-box {
      position: relative;
      background: rgba(250, 246, 240, 0.9);
      border: 1.5px solid #7F6752;
      border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px;
      box-shadow: 4px 6px 0px rgba(140, 109, 83, 0.12);
    }

    .sketch-box::after {
      content: "";
      position: absolute;
      inset: -4px;
      border: 1px dashed rgba(141, 169, 196, 0.75);
      border-radius: 18px 255px 18px 225px / 225px 18px 255px 18px;
      pointer-events: none;
    }

    .sketch-portrait {
      position: relative;
      border: 2px solid #6E5846;
      border-radius: 160px 160px 24px 24px / 150px 150px 28px 20px;
      background: linear-gradient(160deg, #D8E5F0 0%, #EFE6D8 100%);
      box-shadow: 5px 7px 0px rgba(92, 73, 56, 0.14);
    }

    .sketch-portrait::before {
      content: "";
      position: absolute;
      inset: -6px;
      border: 1.2px solid rgba(141, 169, 196, 0.85);
      border-radius: 165px 155px 28px 22px / 145px 155px 22px 28px;
      transform: rotate(-1.2deg);
      pointer-events: none;
    }

    .sketch-btn {
      position: relative;
      border: 1.5px solid #5C4938;
      border-radius: 255px 25px 225px 25px / 25px 225px 25px 255px;
      transition: all 0.25s ease;
      box-shadow: 3px 4px 0px #5C4938;
    }

    .sketch-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 6px 0px #5C4938;
    }

    .sketch-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #5C4938;
    }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(1.5deg); }
    }

    .float-slow {
      animation: gentleFloat 5s ease-in-out infinite;
    }
  </style>
</head>

<body class="antialiased selection:bg-softBlue selection:text-sepia">

  <!-- Hidden SVG Filter for Pencil Sketch Texture -->
  <svg class="hidden" aria-hidden="true">
    <defs>
      <filter id="pencil-stroke">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <!-- SAMPUL DEPAN (FULL SCREEN COVER PAGE) -->
  <main class="relative min-h-screen flex flex-col items-center justify-between py-8 px-5 text-center overflow-hidden">
    <!-- Subtle blurred background wash of sampul.jpg -->
    <div
      class="pointer-events-none absolute inset-0 bg-cover bg-center opacity-15 blur-xl scale-105"
      style="background-image: url('sampul.jpg');"
    ></div>
    <div class="pointer-events-none absolute -top-10 -left-10 w-64 h-64 rounded-full bg-softBlue/50 blur-2xl"></div>
    <div class="pointer-events-none absolute -bottom-10 -right-10 w-72 h-72 rounded-full bg-beige/80 blur-2xl"></div>

    <!-- Top Hand-Drawn Floral Sprig -->
    <div class="relative z-10 mt-1 float-slow">
      <svg class="w-44 h-14 mx-auto text-earth" viewBox="0 0 240 80" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter: url(#pencil-stroke)">
        <path d="M20 55 C70 25, 170 25, 220 55" stroke="#8C6D53" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M120 32 C110 15, 95 18, 102 34 C106 40, 118 36, 120 32 Z" fill="#D8E5F0" stroke="#5C4938" stroke-width="1.3"/>
        <path d="M120 32 C130 15, 145 18, 138 34 C134 40, 122 36, 120 32 Z" fill="#D8E5F0" stroke="#5C4938" stroke-width="1.3"/>
        <path d="M85 38 C72 24, 58 30, 68 42 C74 46, 82 42, 85 38 Z" fill="#EFE6D8" stroke="#8C6D53" stroke-width="1.2"/>
        <path d="M155 38 C168 24, 182 30, 172 42 C166 46, 158 42, 155 38 Z" fill="#EFE6D8" stroke="#8C6D53" stroke-width="1.2"/>
        <circle cx="120" cy="32" r="3.5" fill="#B08968" stroke="#5C4938" stroke-width="1"/>
        <circle cx="50" cy="46" r="2.5" fill="#8DA9C4"/>
        <circle cx="190" cy="46" r="2.5" fill="#8DA9C4"/>
      </svg>
      <p class="font-sketch text-2xl text-deepBlue tracking-wide -mt-1">The Wedding Of</p>
    </div>

    <!-- Center Sketch Portrait Arch (Foto Sampul) & Couple Names -->
    <div class="relative z-10 my-auto max-w-md w-full py-3">
      <div class="sketch-portrait w-60 sm:w-64 aspect-[9/15] mx-auto p-2.5 flex items-center justify-center mb-6 overflow-hidden">
        <img
          src="sampul.jpg"
          alt="Ilustrasi Pernikahan Efrizal &amp; Vina Dewi Pohan"
          class="w-full h-full object-cover rounded-[148px_148px_18px_18px/138px_138px_22px_16px] border border-sepia/30 shadow-sm"
        />
      </div>

      <h1 class="font-serif text-4xl sm:text-5xl font-semibold text-sepia tracking-tight leading-tight">
        Efrizal
        <span class="block font-sketch text-3xl text-pastelBlue my-1">&amp;</span>
        Vina Dewi Pohan
      </h1>

      <p class="mt-3 text-sm uppercase tracking-[0.25em] text-earth font-medium">
        Sabtu, 21 November 2026
      </p>

      <!-- Guest Name Card -->
      <div class="sketch-box mt-6 mx-auto max-w-xs px-5 py-3.5 bg-paper/90">
        <p class="text-xs text-earth uppercase tracking-widest">Kepada Yth. Bapak/Ibu/Saudara/i</p>
        <p id="guestNameDisplay" class="font-serif text-xl font-semibold text-sepia mt-1">Tamu Kehormatan</p>
        <p class="font-sketch text-base text-deepBlue mt-0.5">Di Tempat</p>
      </div>
    </div>

    <!-- Tombol Buka Undangan (Mengarahkan ke halaman baru undangan.html) -->
    <div class="relative z-10 mb-2">
      <a
        id="openInvitationLink"
        href="undangan.html?autoplay=1"
        class="sketch-btn bg-sepia text-paper px-7 py-3.5 font-medium text-sm tracking-wider uppercase inline-flex items-center gap-2.5 hover:bg-earth cursor-pointer"
      >
        <svg class="w-4 h-4 text-softBlue" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
        <span>Buka Undangan</span>
      </a>
    </div>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const guestParam = params.get('to') || params.get('kepada');
      const openLink = document.getElementById('openInvitationLink');

      const targetParams = new URLSearchParams();
      targetParams.set('autoplay', '1');
      if (guestParam) {
        document.getElementById('guestNameDisplay').textContent = guestParam;
        targetParams.set('to', guestParam);
      }

      const targetUrl = 'undangan.html?' + targetParams.toString();
      openLink.setAttribute('href', targetUrl);

      openLink.addEventListener('click', function (e) {
        e.preventDefault();
        try {
          sessionStorage.setItem('undangan_opened', '1');
        } catch {}
        document.body.classList.add('page-leave');
        setTimeout(function () {
          window.location.href = targetUrl;
        }, 350);
      });
    })();
  </script>
</body>
</html>
